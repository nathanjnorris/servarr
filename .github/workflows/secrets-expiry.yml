name: Secrets expiry check

# Weekly. Reads the inventory in SECRETS.md and opens an issue that @-mentions and is assigned to the owner
# when a secret is due for rotation within 30 days (or has no confirmed date). Read-only otherwise.

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check secret expiry dates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the inventory
        id: check
        run: |
          set +e
          bash scripts/secrets-expiry-check.sh SECRETS.md | tee /tmp/due.txt
          status=${PIPESTATUS[0]}
          {
            echo "report<<EOF"
            cat /tmp/due.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Open (or update) an issue for the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Secrets need rotating or confirming"
          body="@${OWNER} these secrets in SECRETS.md need attention:

          \`\`\`
          ${REPORT}
          \`\`\`

          Rotation steps are in SECRETS.md. Update the row's date when done."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$OWNER" --title "$title" --body "$body"
          fi
