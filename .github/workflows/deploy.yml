name: Deploy

# Nothing that restarts a container or changes live infrastructure runs until Plex is idle: this workflow applies what is on main, and only when nobody is watching Plex.
#
# Plex is checked live twice: before anything starts, and again immediately before the containers are
# restarted. If someone is streaming it stops and tries again at
# the next hourly run; the marker on the host makes a no-change run a cheap no-op.
#
# Triggers: a push to main (so merges roll out promptly when idle), an hourly retry, and by hand.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - "renovate.json"
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: "nathanjnorris-org"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "servarr"
  CONFIG_DIRECTORY: "./"

permissions:
  contents: read

jobs:
  window:
    name: Check pending changes and Plex
    # Manual runs from any other branch would apply and deploy that branch, so refuse them.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ github.sha }}
    env:
      MACHINE: servarr
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
      USER: ${{ vars.SSH_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha

      - name: Connect to host
        run: |
          mkdir -p ~/.ssh
          MACHINE_IP="$(tailscale ip -6 "$MACHINE")"
          echo "MACHINE_IP=$MACHINE_IP" >> "$GITHUB_ENV"
          # Pinned host key (public, committed), same as the host-drift job: every ssh in this job refuses a host
          # that does not present it, so secrets and the sudo password can only reach the real machine.
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlias servarr\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          printf "%s" "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Decide
        id: decide
        run: |
          deployed=$(ssh -i ~/.ssh/key "$USER@$MACHINE_IP" 'cat servarr/.deployed-sha 2>/dev/null || true')
          echo "deployed: ${deployed:-none}"
          echo "main:     $GITHUB_SHA"
          if [ "$deployed" = "$GITHUB_SHA" ]; then
            echo "Already deployed; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never restart anything while someone is watching; the next hourly run tries again.
          ssh -i ~/.ssh/key "$USER@$MACHINE_IP" 'cd servarr && git fetch -q origin && git show '"$GITHUB_SHA"':scripts/plex-busy.sh > /tmp/plex-busy.sh && bash /tmp/plex-busy.sh' && busy=0 || busy=$?
          if [ "$busy" = "10" ]; then
            echo "::warning::Plex is in use; deploy postponed to the next hourly run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$busy" = "0" ] || exit "$busy"
          echo "run=true" >> "$GITHUB_OUTPUT"

  terraform_apply:
    name: Terraform apply
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create apply run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply from GitHub Actions ${{ github.sha }}"

  host_deploy:
    name: Deploy to host
    needs: [window, terraform_apply]
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      MACHINE: servarr
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
      USER: ${{ vars.SSH_USERNAME }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the pinned host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.window.outputs.sha }}
          sparse-checkout: .github/ssh_known_hosts
          sparse-checkout-cone-mode: false

      - name: Setup Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha

      - name: Connect to host
        run: |
          mkdir -p ~/.ssh
          MACHINE_IP="$(tailscale ip -6 "$MACHINE")"
          echo "MACHINE_IP=$MACHINE_IP" >> "$GITHUB_ENV"
          # Pinned host key (public, committed), same as the host-drift job: every ssh in this job refuses a host
          # that does not present it, so secrets and the sudo password can only reach the real machine.
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlias servarr\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          printf "%s" "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Pull the exact commit this run evaluated
        run: |
          ssh -i ~/.ssh/key "$USER@$MACHINE_IP" "cd servarr && git fetch -q origin && git reset --hard $DEPLOY_SHA"

      - name: Setup users, folders, and permissions
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          ssh -i ~/.ssh/key "$USER@$MACHINE_IP" 'cd servarr && sudo -S bash setup.sh' <<< "$SUDO_PASSWORD"

      - name: Add secrets to .env file
        env:
          TUNNEL_TOKEN: ${{ secrets.SERVARR_TUNNEL_TOKEN }}
          GLUETUN_PRIVATE_KEY: ${{ secrets.GLUETUN_PRIVATE_KEY }}
          GLUETUN_PRESHARED_KEY: ${{ secrets.GLUETUN_PRESHARED_KEY }}
          GLUETUN_WIREGUARD_ADDRESS: ${{ secrets.GLUETUN_WIREGUARD_ADDRESS }}
          GLUETUN_PORT: ${{ secrets.GLUETUN_PORT }}
          TS_CLIENT_SECRET_EXIT_NODE: ${{ secrets.TS_CLIENT_SECRET_EXIT_NODE }}
          KOPIA_PASSWORD: ${{ secrets.KOPIA_PASSWORD }}
          HOME_ASSISTANT_DNS_TOKEN: ${{ secrets.HOME_ASSISTANT_DNS_TOKEN }}
        run: |
          # Values travel over stdin, never inside a remote shell command, so nothing is expanded on the host.
          printf '%s=%s\n' \
            TUNNEL_TOKEN "$TUNNEL_TOKEN" \
            GLUETUN_PRIVATE_KEY "$GLUETUN_PRIVATE_KEY" \
            GLUETUN_PRESHARED_KEY "$GLUETUN_PRESHARED_KEY" \
            GLUETUN_WIREGUARD_ADDRESS "$GLUETUN_WIREGUARD_ADDRESS" \
            GLUETUN_PORT "$GLUETUN_PORT" \
            TS_CLIENT_SECRET_EXIT_NODE "$TS_CLIENT_SECRET_EXIT_NODE" \
            KOPIA_PASSWORD "$KOPIA_PASSWORD" \
            HOME_ASSISTANT_DNS_TOKEN "$HOME_ASSISTANT_DNS_TOKEN" \
            | ssh -i ~/.ssh/key "$USER@$MACHINE_IP" 'cd servarr && umask 077 && cat > .env'

      - name: Last check, then deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/key "$USER@$MACHINE_IP" 'cd servarr && bash scripts/plex-busy.sh' && busy=0 || busy=$?
          if [ "$busy" = "10" ]; then
            echo "::warning::Plex is in use; restart postponed to the next hourly run."
            exit 0
          fi
          [ "$busy" = "0" ] || exit "$busy"
          ssh -i ~/.ssh/key "$USER@$MACHINE_IP" "cd servarr && bash deploy.sh"

  github_settings:
    name: Settings Terraform cannot manage
    # Idempotent script (scripts/github-settings.sh), tracked in docs/NON_TERRAFORM_CONFIG.md. Runs after the apply
    # so it never races Terraform, and does not touch the host or Plex.
    needs: [window, terraform_apply]
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Apply GitHub settings
        env:
          GH_TOKEN: ${{ secrets.GHA_SERVARR_CODE_SCAN }}
        run: bash scripts/github-settings.sh

  notify_failure:
    name: Tell me if it failed
    needs: [window, terraform_apply, host_deploy, github_settings]
    if: always() && (needs.window.result == 'failure' || needs.terraform_apply.result == 'failure' || needs.host_deploy.result == 'failure' || needs.github_settings.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue assigned to the owner (GitHub mobile pushes this)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Deploy failed ($(date -u +%F))" \
            --body "@${GITHUB_REPOSITORY_OWNER} the deploy failed: $RUN_URL

          It retries at the next hourly run, or run it by hand from the Actions tab."
