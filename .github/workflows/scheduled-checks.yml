name: Scheduled checks

# One weekly workflow, three read-only checks, each opening an issue that @-mentions and is assigned to the owner
# (GitHub mobile pushes it) when something needs attention:
#   terraform_drift  speculative plan: live Cloudflare/GitHub/etc. no longer match the code
#   host_drift       the media host no longer matches the repo (scripts/host-drift.sh)
#   secrets_expiry   a secret in SECRETS.md is due for rotation within 30 days
# Run it by hand from the Actions tab after changing any of them.

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  terraform_drift:
    name: Terraform drift (speculative plan)
    runs-on: ubuntu-latest
    # Only this job gets the Terraform Cloud token; the host and secrets checks do not need it.
    env:
      TF_CLOUD_ORGANIZATION: "nathanjnorris-org"
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
      TF_WORKSPACE: "servarr"
      CONFIG_DIRECTORY: "./"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: plan
        with:
          plan: ${{ fromJSON(steps.run.outputs.payload).data.relationships.plan.data.id }}

      - name: Open an issue if there is drift
        if: steps.plan.outputs.add != '0' || steps.plan.outputs.change != '0' || steps.plan.outputs.destroy != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ADD: ${{ steps.plan.outputs.add }}
          CHANGE: ${{ steps.plan.outputs.change }}
          DESTROY: ${{ steps.plan.outputs.destroy }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
        with:
          script: |
            const { ADD, CHANGE, DESTROY, RUN_LINK } = process.env;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected: ${ADD} to add, ${CHANGE} to change, ${DESTROY} to destroy`,
              body: `@${{ github.repository_owner }} the weekly plan against \`main\` is not empty.\n\n[Terraform Cloud run](${RUN_LINK})\n\nEither a setting was changed outside Terraform, or a merged change has not applied.`,
            });

  host_drift:
    name: Host drift
    runs-on: ubuntu-latest
    env:
      MACHINE: servarr
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
      USER: ${{ vars.SSH_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha

      - name: Connect to host
        run: |
          mkdir -p ~/.ssh
          MACHINE_IP="$(tailscale ip -6 "$MACHINE")"
          echo "MACHINE_IP=$MACHINE_IP" >> "$GITHUB_ENV"
          # Pinned host key (public, committed): the connection fails if the host is not the real one.
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          printf "%s" "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Run the drift script
        id: drift
        run: |
          set +e
          ssh -i ~/.ssh/key -o HostKeyAlias=servarr -o StrictHostKeyChecking=yes "$USER@$MACHINE_IP" 'cd servarr && bash scripts/host-drift.sh' | tee /tmp/drift.txt
          status=${PIPESTATUS[0]}
          {
            echo "report<<EOF"
            cat /tmp/drift.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Open an issue assigned to the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ steps.drift.outputs.report }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Host drift detected ($(date -u +%F))" \
            --body "@${GITHUB_REPOSITORY_OWNER} the weekly host check found problems: $RUN_URL

          $REPORT"

  secrets_expiry:
    name: Secrets expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the inventory
        id: check
        run: |
          set +e
          bash scripts/secrets-expiry-check.sh SECRETS.md | tee /tmp/due.txt
          status=${PIPESTATUS[0]}
          {
            echo "report<<EOF"
            cat /tmp/due.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Open (or update) an issue for the owner
        if: always() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Secrets need rotating or confirming"
          body="@${OWNER} these secrets in SECRETS.md need attention:

          \`\`\`
          ${REPORT}
          \`\`\`

          Rotation steps are in SECRETS.md. Update the row's date when done."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$OWNER" --title "$title" --body "$body"
          fi
