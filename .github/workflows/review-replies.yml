name: Review replies

# Branch policy: every review thread must be RESOLVED (ruleset) and must also have been ANSWERED, meaning at
# least one comment from someone other than the person who opened the thread, saying what was done or why not.
# GitHub has no native "must reply" rule, so this publishes a commit status "Review replies" on the PR head
# commit, and the ruleset requires that status.
#
# The status stays PENDING (blocking merge) until Copilot has reviewed the PR and CodeQL has finished, so it can never
# pass just because nobody has looked yet. Copilot reviews once when the PR opens (review_on_push is off in the ruleset),
# so "reviewed" means at least one Copilot review exists on the PR.
#
# A status is posted explicitly (rather than relying on the job's own check) because scheduled runs use the default
# branch's commit, which would attach the result to the wrong place. Known gap: resolving a thread without replying
# is only noticed by the next 10-minute sweep.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
  pull_request_review_comment:
  # Actions has no event for "thread resolved", so a sweep catches a thread that was resolved without a reply.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

# One run at a time, and a queued run is replaced by a newer one. That is safe because every run re-reads the
# state of ALL open PRs, so a dropped run never leaves a PR unchecked and a slow run cannot overwrite a newer result.
concurrency:
  group: review-replies
  cancel-in-progress: false

jobs:
  replies:
    name: Review threads answered
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token on pull_request events and cannot post a status; the scheduled sweep
    # (default-branch token, can write) covers them instead.
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check every resolved thread has a reply (fails closed on any API error)
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          rc=0
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            # --paginate walks every page of threads; any API or jq error aborts the job instead of passing.
            # shellcheck disable=SC2016  # $o/$r/$n/$endCursor are GraphQL variables, not shell
            unanswered=$(gh api graphql --paginate -f query='
              query($o:String!,$r:String!,$n:Int!,$endCursor:String){repository(owner:$o,name:$r){pullRequest(number:$n){
                reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor}
                  nodes{isResolved path comments(first:100){nodes{author{login}}}}}}}}' \
              -f o="$owner" -f r="$repo" -F n="$pr" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                    | select(.isResolved and ([.comments.nodes[].author.login] | unique | length) < 2)
                    | .path')
            # shellcheck disable=SC2016  # GraphQL variables, not shell
            # Paginated, and the login match tolerates a "[bot]" suffix (GraphQL omits it, REST adds it).
            copilot=$(gh api graphql --paginate -f query='
              query($o:String!,$r:String!,$n:Int!,$endCursor:String){repository(owner:$o,name:$r){pullRequest(number:$n){
                reviews(first:100,after:$endCursor){pageInfo{hasNextPage endCursor}nodes{author{login}}}}}}' \
              -f o="$owner" -f r="$repo" -F n="$pr" \
              --jq '.data.repository.pullRequest.reviews.nodes[].author.login | select(startswith("copilot-pull-request-reviewer"))' | wc -l | tr -d ' ')
            # --paginate so a CodeQL run on a later page of check runs is never missed.
            scanning=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name == "CodeQL" or (.name | startswith("Analyze"))) | .status' | sort -u | tr '\n' ' ')
            case "$scanning" in
              "") scanning=missing ;;
              "completed ") scanning="finished" ;;
              *) scanning=running ;;
            esac
            if [ "$copilot" = "0" ]; then
              state=pending
              desc="Waiting for the Copilot review"
            elif [ "$scanning" != "finished" ]; then
              state=pending
              desc="Waiting for CodeQL ($scanning)"
            elif [ -n "$unanswered" ]; then
              state=failure
              desc="Resolved without a reply: $(echo "$unanswered" | sort -u | tr '\n' ' ' | cut -c1-100)"
              rc=1
            else
              state=success
              desc="Copilot reviewed, CodeQL done, every resolved thread has a reply"
            fi
            echo "#$pr $state: $desc"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" -f context="Review replies" -f description="$desc" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          done <<< "$prs"
          exit "$rc"
