name: Review replies

# Branch policy: every review thread must be RESOLVED (ruleset) and must also have been ANSWERED, meaning at
# least one comment from someone other than the person who opened the thread, saying what was done or why not.
# GitHub has no native "must reply" rule, so scripts/review-replies-check.sh publishes a commit status
# "Review replies" on the PR head commit, and the ruleset requires that status.
#
# The status stays PENDING (blocking merge) until Copilot has reviewed the PR and CodeQL has finished, so it can
# never pass just because nobody has looked yet. Copilot reviews once when the PR opens (review_on_push is off in
# the ruleset), so "reviewed" means at least one Copilot review exists on the PR.
#
# Triggers: the PR itself (opened/pushed) and a 5-minute sweep that refreshes every open PR, so a Copilot review, a
# finished CodeQL run, a reply, or a resolved thread is reflected within about five minutes.
#
# Each event run looks at ONLY the pull request in focus, and its result is that PR's result. A separate scheduled
# sweep refreshes every open PR's status (Actions has no "thread resolved" event, and bot-triggered review events need manual approval) but never fails: the status
# itself carries the result. A status is posted explicitly because scheduled runs use the default branch's commit.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # No review/review-comment triggers: runs started by Copilot's own review comments wait for manual approval
  # (bot actors) and replaced queued runs show up as cancelled noise. The sweep picks those changes up instead.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

# One run per pull request at a time (a newer queued run replaces an older queued one for the SAME PR only), and
# one for the sweep, so runs for different PRs never replace or fail each other.
concurrency:
  group: ${{ github.event_name != 'pull_request' && 'review-replies-sweep' || format('review-replies-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  replies:
    name: Review threads answered
    # Fork PRs get a read-only token on pull_request events and cannot post a status; the sweep covers them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Run the checker from the BASE commit, never the PR's own copy: this token can write commit statuses, so a PR
      # must not be able to change the script that grades it. (Changes to the script take effect once merged.)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check this pull request
        run: bash scripts/review-replies-check.sh "$PR" "$SHA"

  sweep:
    name: Refresh all open pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Refresh every open PR (a failing PR never fails this job; its status carries the result)
        run: |
          set -uo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.number) \(.head.sha)"' |
          while read -r pr sha; do
            bash scripts/review-replies-check.sh "$pr" "$sha" || echo "::notice::#$pr is not passing (see its Review replies status)"
          done
