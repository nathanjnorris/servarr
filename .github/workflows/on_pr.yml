on:
  pull_request:

env:
  TF_CLOUD_ORGANIZATION: "nathanjnorris-org"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "servarr"
  CONFIG_DIRECTORY: "./"

permissions: read-all

# A newer push to the same PR supersedes any run still in flight.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # CI never pushes commits back to the PR branch. A commit pushed by github-actions[bot] counts as an
  # outside contributor under this repo's approval policy, so it stalled the next run until a human approved it.
  # Formatting and docs are therefore checked here and fixed by the author (terraform fmt, terraform-docs).
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did this PR touch Terraform?
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '\.tf$|\.terraform\.lock\.hcl$|\.github/workflows/on_pr\.yml$'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  terraform_format_and_docs:
    name: Terraform format and docs
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format (check only)
        run: terraform fmt -check -recursive .

      - name: Terraform Docs (check only)
        uses: terraform-docs/gh-actions@v1.1.0
        with:
          find-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true
          git-push: false

  terraform_plan:
    name: Terraform plan
    needs: [changes, terraform_format_and_docs]
    # Dependabot PRs cannot read Actions secrets, so the plan cannot run for them. A skipped job counts as
    # passed for a required check, so Dependabot PRs that do not touch Terraform (compose images, Actions)
    # are not blocked. Dependabot PRs that do touch Terraform fail here and need a human, as they should.
    if: always() && (needs.changes.outputs.terraform == 'true' || github.actor != 'dependabot[bot]') && needs.terraform_format_and_docs.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.2.0
        id: plan-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.2.0
        id: plan-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.2.0
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Update PR
        uses: actions/github-script@v7
        id: plan-comment
        env:
          ADD: ${{ steps.plan-output.outputs.add }}
          CHANGE: ${{ steps.plan-output.outputs.change }}
          DESTROY: ${{ steps.plan-output.outputs.destroy }}
          RUN_LINK: ${{ steps.plan-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { ADD, CHANGE, DESTROY, RUN_LINK } = process.env;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Cloud Plan Output')
            });
            const output = `#### Terraform Cloud Plan Output
            \`\`\`
            Plan: ${ADD} to add, ${CHANGE} to change, ${DESTROY} to destroy.
            \`\`\`
            [Terraform Cloud Plan](${RUN_LINK})
            `;
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
