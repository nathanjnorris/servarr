name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Compose config
        run: docker compose config --quiet

      - name: ShellCheck
        run: shellcheck deploy.sh setup.sh macvlan.sh scripts/*.sh

      - name: Actionlint
        run: |
          # Pinned: the installer script and the binary are both fixed to this release, not whatever main holds today.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Terraform format (check only)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
