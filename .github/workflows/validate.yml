name: Validate

on:
  pull_request:
    # edited: fixing a PR title re-runs the check
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Conventional commits (PR title and every commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/conventional-check.sh --self-test
          bash scripts/conventional-check.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Docker Compose config
        run: docker compose config --quiet

      - name: ShellCheck
        run: shellcheck deploy.sh setup.sh macvlan.sh scripts/*.sh .claude/hooks/*.sh .github/hooks/*.sh

      - name: Copilot permission hook tests
        run: python3 -m unittest discover -s .github/hooks -p 'test_*.py'

      - name: Actionlint
        run: |
          # Pinned: the installer script and the binary are both fixed to this release, not whatever main holds today.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint

      - name: Terraform setup
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.2

      - name: Terraform format (check only)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
