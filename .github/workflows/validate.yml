name: Validate

on:
  pull_request:
    # edited: fixing a PR title re-runs the check
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional commits (PR title and every commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/conventional-check.sh --self-test
          bash scripts/conventional-check.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Docker Compose config
        run: docker compose config --quiet

      - name: ShellCheck
        run: shellcheck deploy.sh setup.sh macvlan.sh scripts/*.sh

      - name: Actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Terraform format (check only)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
