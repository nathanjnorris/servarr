name: Drift check

# Weekly speculative plan against Terraform Cloud. Opens an issue if live Cloudflare/GitHub
# settings no longer match the code (for example after a manual dashboard change).
# Run it once by hand (Actions > Drift check > Run workflow) after merging to confirm it works.

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

env:
  TF_CLOUD_ORGANIZATION: "nathanjnorris-org"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "servarr"
  CONFIG_DIRECTORY: "./"

permissions:
  contents: read
  issues: write

jobs:
  plan:
    name: Speculative plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan
        with:
          plan: ${{ fromJSON(steps.run.outputs.payload).data.relationships.plan.data.id }}

      - name: Open an issue if there is drift
        if: steps.plan.outputs.add != '0' || steps.plan.outputs.change != '0' || steps.plan.outputs.destroy != '0'
        uses: actions/github-script@v9
        env:
          ADD: ${{ steps.plan.outputs.add }}
          CHANGE: ${{ steps.plan.outputs.change }}
          DESTROY: ${{ steps.plan.outputs.destroy }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
        with:
          script: |
            const { ADD, CHANGE, DESTROY, RUN_LINK } = process.env;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected: ${ADD} to add, ${CHANGE} to change, ${DESTROY} to destroy`,
              body: `The weekly plan against \`main\` is not empty.\n\n[Terraform Cloud run](${RUN_LINK})\n\nEither a setting was changed outside Terraform, or a merged change has not applied.`,
            });
