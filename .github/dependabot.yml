version: 2
updates:
  # Docker Compose image tags. Dependabot only sees pinned tags, not `latest`.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      linuxserver:
        patterns: ["ghcr.io/linuxserver/*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    # Cloudflare v5 needs the staged migration in TERRAFORM_UPLIFT_PLAN.md; do not let it arrive on its own.
    ignore:
      - dependency-name: "cloudflare/cloudflare"
        update-types: ["version-update:semver-major"]
