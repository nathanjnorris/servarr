name: servarr
services:
# Media server  
  plex:
    image: ghcr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls333
    container_name: plex
    environment:
      - PUID=13001
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # docker = the image decides the Plex version (pinned by the image tag). public would let a restart
      # self-update Plex to the newest public release behind the pin's back.
      - VERSION=docker
    devices:
      - /dev/dri:/dev/dri
    #  - /dev/dvb:/dev/dvb
    volumes: 
      - /home/nathan/servarr/config/plex-config:/config
      # Add temp HDD
      - /mnt/temp-data:/temp-data
      - /mnt/data/media:/data/media
      - /mnt/data/recordings:/data/recordings
      - /mnt/data/optimised:/data/optimised
      - /dev/shm:/transcode
      - /var/tmp/plex:/downloads
    ports:
      - 32400:32400 # enable local access
    restart: always
# Media requests
  # Seerr (successor to Overseerr). The "overseerr" network alias keeps existing
  # in-network references (Maintainerr, Uptime Kuma, tunnel routes) resolving.
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    container_name: seerr
    networks:
      default:
        aliases:
          - overseerr
    environment:
      - TZ=Australia/Brisbane
    volumes:
      # Runs as UID 1000 (node); host dir must be owned 1000:1000 (see setup.sh)
      - /home/nathan/servarr/config/overseerr-config:/app/config
    # ports:
    #   - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: always
# Media monitoring
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13003
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # Cloudflare Access (Google SSO) is the gate when coming via the tunnel; don't ask for a second login
      - SONARR__AUTH__METHOD=External
    volumes:
      - /home/nathan/servarr/config/sonarr-config:/config
      - /mnt/data:/data
    restart: always

  4ksonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: 4ksonarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13003
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # Cloudflare Access (Google SSO) is the gate when coming via the tunnel; don't ask for a second login
      - SONARR__AUTH__METHOD=External
    volumes:
      - /home/nathan/servarr/config/4ksonarr-config:/config
      - /mnt/data:/data
    restart: always

  radarr:
    image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13004
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # Cloudflare Access (Google SSO) is the gate when coming via the tunnel; don't ask for a second login
      - RADARR__AUTH__METHOD=External
    volumes:
      - /home/nathan/servarr/config/radarr-config:/config
      - /mnt/data:/data
    restart: always

  4kradarr:
    image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: 4kradarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13004
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # Cloudflare Access (Google SSO) is the gate when coming via the tunnel; don't ask for a second login
      - RADARR__AUTH__METHOD=External
    volumes:
      - /home/nathan/servarr/config/4kradarr-config:/config
      - /mnt/data:/data
    restart: always
# Subtitles
  bazarr: 
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls373
    container_name: bazarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13005
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
    volumes:
      - /home/nathan/servarr/config/bazarr-config:/config
      - /mnt/data/media:/data/media
    restart: always

  4kbazarr: 
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls373
    container_name: 4kbazarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13005
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
    volumes:
      - /home/nathan/servarr/config/4kbazarr-config:/config
      - /mnt/data/media:/data/media
    restart: always
# Media download
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13006
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      # Cloudflare Access (Google SSO) is the gate when coming via the tunnel; don't ask for a second login
      - PROWLARR__AUTH__METHOD=External
    volumes:
      - /home/nathan/servarr/config/prowlarr-config:/config
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Australia/Brisbane
    restart: always

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=13007
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${GLUETUN_PORT}
    volumes:
      - /home/nathan/servarr/config/qbittorrent-config:/config
      - /mnt/data/torrents:/data/torrents
    restart: always
# Media management
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.33.0
    container_name: maintainerr
    user: 13008:13000
    volumes:
      - /home/nathan/servarr/config/maintainerr-config:/opt/data
    environment:
      - TZ=Australia/Brisbane
    # ports:
    #   - 6246:6246
    restart: always

  # 4kmaintainerr:
  #   image: ghcr.io/maintainerr/maintainerr:3.32.0
  #   container_name: 4kmaintainerr
  #   user: 13008:13000
  #   volumes:
  #     - /home/nathan/servarr/config/4kmaintainerr-config:/opt/data
  #   environment:
  #     - TZ=Australia/Brisbane
  #   # ports:
  #   #   - 6246:6246
  #   restart: always
# User management
  tautulli:
    image: ghcr.io/linuxserver/tautulli:v2.19.1-ls252
    container_name: tautulli
    depends_on:
      - plex
    environment:
      - PUID=13009
      - PGID=13000
      - UMASK=002
      - TZ=Australia/Brisbane
    volumes:
      - /home/nathan/servarr/config/tautulli-config:/config
    # ports:
    #   - 8181:8181
    restart: always

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.10.1
    container_name: wizarr
    init: true # reaps the defunct curl healthcheck process
    environment:
      - PUID=13010
      - PGID=13000
      - DISABLE_BUILTIN_AUTH=false 
      - TZ=Australia/Brisbane
    volumes:
      - /home/nathan/servarr/config/wizarr-config:/data
    # ports:
    #   - 5690:5690
    restart: always
# Networking
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    container_name: cloudflared
    command: tunnel run --protocol http2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: always

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /home/nathan/servarr/config/gluetun-config:/gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${GLUETUN_WIREGUARD_ADDRESS}
      - SERVER_REGIONS=Oceania
      - FIREWALL_VPN_INPUT_PORTS=${GLUETUN_PORT}
      - HEALTH_VPN_DURATION_INITIAL=60s
      - TZ=Australia/Brisbane
      - UPDATER_PERIOD=24h
    restart: always

  # Tailscale exit node via VPN on router
  tailscale-exit-node:
    image: tailscale/tailscale:v1.104.7
    container_name: tailscale-exit-node
    networks:
      macvlan0:
        ipv4_address: 192.168.8.5
    mac_address: 'ee:30:7f:4b:51:b6'
    volumes:
      - /home/nathan/servarr/config/tailscale-config:/var/lib/tailscale
    cap_add:
      - net_admin
    environment:
      - TS_AUTHKEY=${TS_CLIENT_SECRET_EXIT_NODE}
      - TS_EXTRA_ARGS=--advertise-tags=tag:vpn --advertise-exit-node --accept-routes --accept-dns
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=vpn
    restart: always

  home-assistant:
    image: ghcr.io/linuxserver/homeassistant:2026.11.2-ls267
    container_name: home-assistant
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Brisbane
    volumes:
      - /home/nathan/servarr/config/home-assistant-config:/config
      - /run/dbus:/run/dbus:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_7832fe7bd4a0f011b6d92681bb936ffa-if00-port0:/dev/ttyUSB0
    restart: always

  traefik-home-assistant:
    image: traefik:v3.7.19
    container_name: traefik-home-assistant
    network_mode: host
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/home-assistant.yml
      - --certificatesresolvers.cloudflare.acme.email=nathanjamesnorris@gmail.com
      - --certificatesresolvers.cloudflare.acme.storage=/data/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
    environment:
      - CF_DNS_API_TOKEN=${HOME_ASSISTANT_DNS_TOKEN}
    volumes:
      - /home/nathan/servarr/config/traefik-home-assistant-config:/data
      - /home/nathan/servarr/traefik-home-assistant.yml:/etc/traefik/home-assistant.yml:ro
    restart: always

  matter-server:
    image: ghcr.io/matter-js/matterjs-server:1.6.0
    container_name: matter-server
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /run/dbus:/run/dbus:ro
      - /home/nathan/servarr/config/matter-server-config:/data
    environment:
      - TZ=Australia/Brisbane
      - NOBLE_BINDINGS=dbus
      - BLUETOOTH_ADAPTER=0
    restart: always

# Backups
  kopia:
      image: kopia/kopia:0.23.1
      container_name: kopia
      # ports:
      #       - 51515:51515
      command:
        - server
        - start
        - --disable-csrf-token-checks
        - --insecure
        - --address=0.0.0.0:51515
        - --server-username=nathan
        - --server-password=${KOPIA_PASSWORD}
      volumes:
        - /mnt/kopia:/tmp:shared
        - /home/nathan/kopia/config:/app/config
        - /home/nathan/kopia/cache:/app/cache
        - /home/nathan/kopia/logs:/app/logs
        - /home/nathan/servarr/config:/data:ro
      environment:
        KOPIA_PASSWORD: ${KOPIA_PASSWORD}
        TZ: Australia/Brisbane
        USER: "nathan"
      restart: "always"
# Read-only view of the Docker API for Uptime Kuma's container monitors. Only container reads are allowed
  # (CONTAINERS=1; every write endpoint such as POST, start, stop, exec and images stays off), and no port is
  # published, so it is reachable only from containers on the compose network. In Uptime Kuma add a Docker host
  # of type TCP with `http://docker-proxy:2375`, then repoint the Docker monitors at it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    restart: always
# Web monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12
    container_name: uptime-kuma
    volumes:
      - /home/nathan/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    # ports:
    #   - 3001:3001
    restart: always

networks:
  macvlan0:
    driver: macvlan
    driver_opts:
      parent: enp1s0
    ipam:
      driver: default
      config:
        - subnet: 192.168.8.0/24
          # The ip_range 192.168.8.4/30 provides only 2 usable IP addresses (192.168.8.5 for the container, 192.168.8.6 for the host).
          ip_range: 192.168.8.4/30
          gateway: 192.168.8.1